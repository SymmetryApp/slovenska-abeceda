<style>
/* Layout: sticky header (title, kid switch, 4 big tabs); one panel at a time; 5x5 letter board; letter card as a centered sheet */
:root {
  --bg: #EAF4FA; --surface: #FFFFFF; --ink: #16324A; --muted: #587187; --line: #CFE0EC;
  --sea: #1A6AAB; --sun: #FFC633; --ok: #1E9A5C; --bad: #D9472F; --scrim: rgba(14, 34, 52, .55);
  --t1: #FFE9A8; --t2: #CDE6FF; --t3: #FFD9CF; --t4: #D3F1DE; --t5: #E7DCFF;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1B28; --surface: #15293A; --ink: #E5EFF7; --muted: #94ABBD; --line: #24405A;
  --sea: #62B3F2; --sun: #FFD15C; --ok: #4CCB86; --bad: #FF7A66; --scrim: rgba(0, 0, 0, .65);
  --t1: #46391A; --t2: #183B5B; --t3: #4A2A24; --t4: #1C4430; --t5: #33295A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1B28; --surface: #15293A; --ink: #E5EFF7; --muted: #94ABBD; --line: #24405A;
  --sea: #62B3F2; --sun: #FFD15C; --ok: #4CCB86; --bad: #FF7A66; --scrim: rgba(0, 0, 0, .65);
  --t1: #46391A; --t2: #183B5B; --t3: #4A2A24; --t4: #1C4430; --t5: #33295A; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px }
h1, h2, h3, p { margin: 0 }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line) }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px 8px }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4.5vw, 34px); letter-spacing: .01em }
h1 span { color: var(--sea) }
.kids { display: flex; gap: 8px }
.kid { padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); font-weight: 800; min-height: 44px }
.kid[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--bg) }
nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 0 10px }
nav button { padding: 8px 4px; border-radius: 16px; font-weight: 800; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 60px }
nav button b { font-size: 24px; line-height: 1 }
nav button[aria-selected="true"] { background: var(--surface); box-shadow: 0 2px 0 var(--line) }

main { padding-block: 18px 48px }
.hint { color: var(--muted); font-weight: 700; margin-bottom: 14px }

/* Alphabet board */
.board { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(8px, 2vw, 14px); max-width: 640px; margin: 0 auto }
.tile { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: clamp(14px, 3vw, 24px); display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: clamp(34px, 8vw, 64px); line-height: 1; transition: transform .12s }
.tile small { font-size: .5em; margin-left: .08em; opacity: .7 }
.tile:active { transform: scale(.94) }
.c1 { background: var(--t1) } .c2 { background: var(--t2) } .c3 { background: var(--t3) } .c4 { background: var(--t4) } .c5 { background: var(--t5) }
.done::after { content: "✓"; position: absolute; top: 6%; right: 8%; font-family: var(--body); font-size: clamp(13px, 2.4vw, 20px); font-weight: 800;
  color: var(--surface); background: var(--ok); width: 1.5em; height: 1.5em; border-radius: 50%; display: grid; place-items: center }

/* Letter card */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.card { position: relative; width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 28px; padding: 22px 20px 18px; display: grid; gap: 12px; justify-items: center; text-align: center }
.x { position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; background: var(--bg) }
.big { font-family: var(--display); font-weight: 600; font-size: clamp(88px, 22vw, 140px); line-height: 1 }
.big small { font-size: .55em; color: var(--muted); margin-left: .12em }
.emoji { font-size: clamp(64px, 16vw, 96px); line-height: 1 }
.word { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 8vw, 46px); line-height: 1.1 }
.word b, .sl b { color: var(--sea) }
.ru { color: var(--muted); font-weight: 700 }
.snd { font-weight: 700 }
.note { background: var(--t1); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 15px; max-width: 34ch }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100% }
.btn { min-height: 56px; padding: 10px 18px; border-radius: 18px; background: var(--bg); font-weight: 800; border: 2px solid var(--line) }
.btn.main { background: var(--sea); border-color: var(--sea); color: var(--surface) }
.btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface) }
.nav2 { display: flex; justify-content: space-between; width: 100% }
.nav2 .btn { min-width: 64px; font-size: 22px }

/* Phrases */
.group + .group { margin-top: 26px }
.group h2 { font-family: var(--body); font-weight: 800; font-size: 20px; margin-bottom: 10px }
.phrases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px }
.phrase { background: var(--surface); border-radius: 20px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; border: 2px solid transparent }
.phrase.done { border-color: var(--ok) }
.phrase.done::after { content: none }
.ph-body { flex: 1; min-width: 0; display: grid; gap: 8px }
.line { display: flex; gap: 10px; align-items: center }
.say { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--t2); font-size: 24px }
.say:active { transform: scale(.92) }
.sl { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.2 }
.tr { color: var(--muted); font-size: 14px }
.mark { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); font-weight: 800; color: var(--muted) }
.mark[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface) }

/* Game */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px }
.mode { min-height: 64px; border-radius: 18px; border: 2px solid var(--line); font-weight: 800; padding: 8px }
.mode[aria-pressed="true"] { border-color: var(--sea); background: var(--surface); color: var(--sea) }
.stage { background: var(--surface); border-radius: 28px; padding: 20px; display: grid; gap: 18px; justify-items: center; text-align: center }
.score { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums }
.ask { width: 120px; height: 120px; border-radius: 50%; background: var(--sea); color: var(--surface); font-size: 52px }
.ask:active { transform: scale(.94) }
.pic { font-size: 110px; line-height: 1; padding: 0 }
.pic + .word { min-height: 1.1em }
.choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; max-width: 640px }
.choice { aspect-ratio: 1; max-width: 100%; border-radius: 24px; font-family: var(--display); font-weight: 600; font-size: clamp(54px, 11vw, 84px); line-height: 1 }
.choice.ok { background: var(--ok); color: var(--surface) }
.choice.bad { background: var(--bad); color: var(--surface); opacity: .55; animation: shake .35s }
.start { min-height: 72px; padding: 0 36px; font-size: 22px }
@keyframes shake { 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
.bravo { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none; font-size: 140px; animation: pop .9s ease-out forwards }
@keyframes pop { 0% { transform: scale(.3); opacity: 0 } 30% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1) translateY(-40px); opacity: 0 } }
@media (max-width: 520px) { .choices { grid-template-columns: 1fr 1fr } .pic { font-size: 84px } .ask { width: 96px; height: 96px; font-size: 42px } .stage { gap: 12px } }

/* Progress */
.prog { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px }
.box { background: var(--surface); border-radius: 22px; padding: 16px; display: grid; gap: 12px; align-content: start }
.count { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums }
.count span { font-size: 18px; color: var(--muted); font-family: var(--body); font-weight: 700 }
.bar { height: 14px; border-radius: 99px; background: var(--bg); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px }
.mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.mini button { aspect-ratio: 1; max-width: 100%; border-radius: 12px; font-family: var(--display); font-weight: 600; font-size: 24px; background: var(--bg); color: var(--muted) }
.mini button.got { background: var(--ok); color: var(--surface) }
.mini button.half { box-shadow: inset 0 0 0 3px var(--ok) }
.legend { color: var(--muted); font-size: 14px }
.reset { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.danger { border-color: var(--bad); color: var(--bad) }
.btn.danger.main { background: var(--bad); color: var(--surface) }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>

const L = DATA.letters;
const PH = DATA.groups.flatMap(g => g.items);
const KIDS = { sasa: { name: "Саша", gen: "Саши", icon: "👦", gender: 0 }, sofija: { name: "София", gen: "Софии", icon: "👧", gender: 1 } };
const $ = id => document.getElementById(id);
const color = i => "c" + (i % 5 + 1);
const lower = l => l.toLowerCase();
const firstBold = w => `<b>${w[0]}</b>${w.slice(1)}`;

/* ---------- Audio: one shared element, so iOS keeps it unlocked after the first tap ---------- */
const player = new Audio();
let queue = [], onDone = null, token = 0;
function say(texts, done) {
  queue = texts.map(t => DATA.audio[t]).filter(Boolean);
  onDone = done || null;
  next(++token);
}
function next(my) {
  if (my !== token) return; // a newer say() took over
  const src = queue.shift();
  if (!src) { const d = onDone; onDone = null; if (d) d(); return; }
  player.src = src;
  player.play().catch(() => { if (my === token) { queue = []; next(my); } }); // blocked sound must not stall the game
}
player.addEventListener("ended", () => { const my = token; setTimeout(() => next(my), 250); });

/* ---------- Progress: per kid; localStorage always, plus the viewer's private db doc when signed in ---------- */
const blank = () => ({ letters: [], half: [], phrases: [] });
let prog = { sasa: blank(), sofija: blank(), updated: 0 };
let kid = "sasa", tab = "abc", ref = null, saveTimer = null, writes = Promise.resolve();
function normalize(p) {
  const out = { updated: +p?.updated || 0 };
  for (const k in KIDS) {
    const src = p?.[k] || {};
    out[k] = { letters: [], half: [], phrases: [] };
    for (const f in out[k]) if (Array.isArray(src[f])) out[k][f] = src[f].filter(x => typeof x === "string");
  }
  return out;
}
try {
  const s = JSON.parse(localStorage.getItem("abeceda") || "null");
  if (s) { prog = normalize(s.prog); if (s.kid in KIDS) kid = s.kid; if (["abc", "phr", "game", "prog"].includes(s.tab)) tab = s.tab; }
} catch (e) {}
const me = () => prog[kid];
function saveLocal() { try { localStorage.setItem("abeceda", JSON.stringify({ prog, kid, tab })); } catch (e) {} }
function save() {
  prog.updated = Date.now();
  saveLocal();
  if (!ref) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(prog));
    writes = writes.then(() => ref.set(body)).catch(e => console.warn("save failed", e));
  }, 700);
}
async function connect() {
  try {
    const db = await window.claude?.use?.("db");
    if (!db) return;
    const user = await window.claude.use("user");
    const uid = await user?.id();
    if (!uid) return;
    const r = db.collection("data/users/" + uid).doc("abeceda");
    const snap = await r.get();
    ref = r;
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && remote.updated >= prog.updated) { prog = remote; saveLocal(); render(); }
    else if (prog.updated) save();
    render();
  } catch (e) { console.warn("db unavailable", e); }
}
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
function toggleLetter(l) { const p = me(); p.letters = toggle(p.letters, l); p.half = p.half.filter(x => x !== l); save(); }
function togglePhrase(id) { me().phrases = toggle(me().phrases, id); save(); }
function credit(l) { // two first-try answers in the game = learned
  const p = me();
  if (p.letters.includes(l)) return;
  if (p.half.includes(l)) { p.half = p.half.filter(x => x !== l); p.letters.push(l); }
  else p.half.push(l);
  save();
}

/* ---------- Header ---------- */
function renderHeader() {
  $("kids").innerHTML = Object.entries(KIDS).map(([k, v]) =>
    `<button class="kid" data-kid="${k}" aria-pressed="${k === kid}">${v.icon} ${v.name}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  for (const id of ["abc", "phr", "game", "prog"]) $(id).hidden = id !== tab;
}
$("kids").onclick = e => { const b = e.target.closest("[data-kid]"); if (b) { kid = b.dataset.kid; confirmReset = false; saveLocal(); render(); } };
$("tabs").onclick = e => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.dataset.tab; game.started = false; player.pause();
  saveLocal(); render(); scrollTo(0, 0);
};

/* ---------- 1. Alphabet ---------- */
function renderAbc() {
  $("abc").innerHTML = `<p class="hint">Нажми на букву — она скажет, как её зовут.</p><div class="board">` +
    L.map((x, i) => `<button class="tile ${color(i)} ${me().letters.includes(x.l) ? "done" : ""}" data-i="${i}" aria-label="Буква ${x.l}"><span>${x.l}<small>${lower(x.l)}</small></span></button>`).join("") +
    `</div>`;
}
$("abc").onclick = e => { const b = e.target.closest("[data-i]"); if (b) openCard(+b.dataset.i); };
let cardI = -1;
function openCard(i, quiet) {
  cardI = (i + L.length) % L.length;
  const x = L[cardI], got = me().letters.includes(x.l);
  $("sheet").innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="Буква ${x.l}">
    <button class="x" data-act="close" aria-label="Закрыть">✕</button>
    <div class="big">${x.l}<small>${lower(x.l)}</small></div>
    <div class="emoji" aria-hidden="true">${x.emoji}</div>
    <div class="word">${firstBold(x.word)}</div>
    <p class="ru">${x.ru}</p>
    <p class="snd">Звук как русская «${x.snd}»</p>
    ${x.note ? `<p class="note">${x.note}</p>` : ""}
    <div class="row">
      <button class="btn main" data-act="name">🔊 Буква</button>
      <button class="btn main" data-act="word">🔊 Слово</button>
    </div>
    <button class="btn" data-act="learn" aria-pressed="${got}">${got ? "✓ Знаю эту букву" : "Знаю эту букву"}</button>
    <div class="nav2">
      <button class="btn" data-act="prev" aria-label="Предыдущая буква">←</button>
      <button class="btn" data-act="next" aria-label="Следующая буква">→</button>
    </div>
  </div>`;
  $("sheet").hidden = false;
  if (!quiet) say([x.name, x.word]);
}
function closeCard() { $("sheet").hidden = true; cardI = -1; player.pause(); render(); }
$("sheet").onclick = e => {
  if (e.target === $("sheet")) return closeCard();
  const act = e.target.closest("[data-act]")?.dataset.act, x = L[cardI];
  if (act === "close") closeCard();
  else if (act === "name") say([x.name]);
  else if (act === "word") say([x.word]);
  else if (act === "prev") openCard(cardI - 1);
  else if (act === "next") openCard(cardI + 1);
  else if (act === "learn") { toggleLetter(x.l); if (me().letters.includes(x.l)) say([DATA.extra.bravo]); openCard(cardI, true); }
};
document.addEventListener("keydown", e => {
  if ($("sheet").hidden) return;
  if (e.key === "Escape") closeCard();
  if (e.key === "ArrowLeft") openCard(cardI - 1);
  if (e.key === "ArrowRight") openCard(cardI + 1);
});

/* ---------- 2. Phrases ---------- */
function renderPhr() {
  const g = KIDS[kid].gender;
  $("phr").innerHTML = `<p class="hint">🔊 — послушать. 👦 — так говорит Саша, 👧 — так говорит София. Русские буквы — примерное произношение.</p>` +
    DATA.groups.map(gr => `<div class="group"><h2>${gr.title}</h2><div class="phrases">` + gr.items.map(p => {
      const i = PH.indexOf(p), got = me().phrases.includes(p.id);
      const lines = p.sl.map((s, v) => `<div class="line">
          <button class="say" data-p="${i}" data-v="${v}" aria-label="Послушать: ${s}">${p.sl.length > 1 ? (v ? "👧" : "👦") : "🔊"}</button>
          <div><p class="sl">${s}</p><p class="tr">примерно: ${p.tr[v]}</p></div></div>`);
      if (p.sl.length > 1 && g) lines.reverse(); // current kid's variant first
      return `<article class="phrase ${got ? "done" : ""}"><div class="ph-body">${lines.join("")}<p class="ru">${p.ru}</p></div>
        <button class="mark" data-m="${i}" aria-pressed="${got}" aria-label="Выучено">✓</button></article>`;
    }).join("") + `</div></div>`).join("");
}
$("phr").onclick = e => {
  const s = e.target.closest("[data-p]");
  if (s) return say([PH[+s.dataset.p].sl[+s.dataset.v]]);
  const m = e.target.closest("[data-m]");
  if (m) { const p = PH[+m.dataset.m]; togglePhrase(p.id); if (me().phrases.includes(p.id)) say([DATA.extra.bravo]); renderPhr(); }
};

/* ---------- 3. Game ---------- */
const PAIRS = { C: "Č", "Č": "C", S: "Š", "Š": "S", Z: "Ž", "Ž": "Z" };
const game = { mode: "hear", started: false, target: null, opts: [], first: true, busy: false, stars: 0, solved: false };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function newRound() {
  const fresh = L.filter(x => !me().letters.includes(x.l) && x !== game.target);
  const pool = fresh.length && Math.random() < .75 ? fresh : L.filter(x => x !== game.target);
  const t = pool[Math.floor(Math.random() * pool.length)];
  const others = PAIRS[t.l] ? [L.find(x => x.l === PAIRS[t.l])] : []; // put the look-alike (C/Č…) in on purpose
  for (const x of shuffle(L)) if (others.length < 3 && x !== t && !others.includes(x)) others.push(x);
  Object.assign(game, { target: t, opts: shuffle([t, ...others]), first: true, busy: false, solved: false });
  renderGame();
  ask();
}
const ask = () => say([game.mode === "hear" ? game.target.name : game.target.word]);
function renderGame() {
  const hear = game.mode === "hear", t = game.target;
  let stage;
  if (!game.started) stage = `<p class="hint">${hear ? "Послушай букву и нажми на неё." : "Посмотри на картинку, послушай слово и найди первую букву."}</p>
    <button class="btn main start" data-g="start">▶ Играть</button>`;
  else stage = `<p class="score" aria-live="polite">⭐ ${game.stars}</p>` +
    (hear ? `<button class="ask" data-g="ask" aria-label="Послушать ещё раз">🔊</button>`
          : `<button class="pic" data-g="ask" aria-label="Послушать слово">${t.emoji}</button>
             <div class="word">${game.solved ? firstBold(t.word) : "&nbsp;"}</div>`) +
    `<div class="choices">${game.opts.map((x, i) => `<button class="choice ${color(L.indexOf(x))}" data-c="${i}">${x.l}</button>`).join("")}</div>`;
  $("game").innerHTML = `<div class="modes">
      <button class="mode" data-mode="hear" aria-pressed="${hear}">👂 Послушай и найди букву</button>
      <button class="mode" data-mode="pic" aria-pressed="${!hear}">🖼️ С какой буквы начинается?</button>
    </div><div class="stage">${stage}</div>`;
}
$("game").onclick = e => {
  const m = e.target.closest("[data-mode]");
  if (m) { game.mode = m.dataset.mode; return game.started ? newRound() : renderGame(); }
  const g = e.target.closest("[data-g]")?.dataset.g;
  if (g === "start") { game.started = true; return newRound(); }
  if (g === "ask") return ask();
  const c = e.target.closest("[data-c]");
  if (!c || game.busy || c.classList.contains("bad")) return;
  const x = game.opts[+c.dataset.c];
  if (x === game.target) {
    game.busy = true; game.solved = true; game.stars++;
    if (game.first) credit(x.l);
    renderGame();
    $("game").querySelector(`[data-c="${c.dataset.c}"]`).classList.add("ok");
    burst();
    say([DATA.extra.bravo], () => setTimeout(() => { if (tab === "game") newRound(); }, 300));
  } else {
    game.first = false;
    c.classList.add("bad");
    say([DATA.extra.again]);
  }
};
function burst() {
  const b = document.createElement("div");
  b.className = "bravo"; b.textContent = "⭐"; b.setAttribute("aria-hidden", "true");
  document.body.append(b);
  setTimeout(() => b.remove(), 950);
}

/* ---------- 4. Progress ---------- */
let confirmReset = false;
function renderProg() {
  const p = me(), k = KIDS[kid];
  const nl = p.letters.length, np = p.phrases.filter(id => PH.some(x => x.id === id)).length;
  $("prog").innerHTML = `<div class="prog">
    <div class="box">
      <h2>${k.icon} ${k.name}: буквы</h2>
      <p class="count">${nl} <span>выучено из ${L.length}</span></p>
      <div class="bar"><i style="width:${nl / L.length * 100}%"></i></div>
      <div class="mini">${L.map(x => `<button data-l="${x.l}" class="${p.letters.includes(x.l) ? "got" : p.half.includes(x.l) ? "half" : ""}" aria-pressed="${p.letters.includes(x.l)}">${x.l}</button>`).join("")}</div>
      <p class="legend">Зелёная — выучена. С зелёной рамкой — один правильный ответ в игре (нужно два). Нажми на букву, чтобы отметить вручную.</p>
    </div>
    <div class="box">
      <h2>${k.icon} ${k.name}: фразы</h2>
      <p class="count">${np} <span>выучено из ${PH.length}</span></p>
      <div class="bar"><i style="width:${np / PH.length * 100}%"></i></div>
      <p class="legend">Отмечайте фразы кнопкой ✓ во вкладке «Фразы».</p>
    </div>
    <div class="box">
      <h2>Где хранится прогресс</h2>
      <p class="legend">${ref ? "☁️ В вашем аккаунте Claude. Откройте эту же ссылку на iPad и iPhone — прогресс будет общим." : "📱 На этом устройстве, в этом браузере. На другом устройстве прогресс будет свой."}</p>
      <div class="reset">${confirmReset
        ? `<span>Сбросить весь прогресс ${k.gen}?</span><button class="btn danger main" data-r="yes">Да, сбросить</button><button class="btn" data-r="no">Отмена</button>`
        : `<button class="btn danger" data-r="ask">Сбросить прогресс ${k.gen}</button>`}</div>
    </div>
  </div>`;
}
$("prog").onclick = e => {
  const l = e.target.closest("[data-l]");
  if (l) { toggleLetter(l.dataset.l); return renderProg(); }
  const r = e.target.closest("[data-r]")?.dataset.r;
  if (!r) return;
  if (r === "yes") { prog[kid] = blank(); save(); }
  confirmReset = r === "ask";
  renderProg();
};

function render() { renderHeader(); renderAbc(); renderPhr(); renderProg(); renderGame(); }
render();
connect();
</script>
